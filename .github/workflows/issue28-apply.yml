name: Apply issue 28 implementation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: issue28-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply implementation and refresh lockfiles
        shell: bash
        run: |
          shopt -s nullglob
          parts=(.github/assistant.issue28.patch.gz.b64.part-*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Issue 28 implementation is already applied."
            exit 0
          fi

          cat "${parts[@]}" | tr -d '\r\n' > "$RUNNER_TEMP/issue28.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/issue28.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/issue28.patch"
          git apply --index --whitespace=nowarn --ignore-space-change --ignore-whitespace "$RUNNER_TEMP/issue28.patch"

          cargo fmt --all
          cargo fmt --manifest-path fullos/src-tauri/Cargo.toml --all
          cargo metadata --format-version 1 > "$RUNNER_TEMP/root-metadata.json"
          cargo metadata --manifest-path fullos/src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/tauri-metadata.json"

          git rm "${parts[@]}"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add versioned SQLite migrations and backups"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
