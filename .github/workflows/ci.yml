name: Apply formatted Rust changes

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply and push formatted Rust changes
        shell: bash
        run: |
          cat .github/assistant.patch.gz.b64.part-* | tr -d '\r\n' > "$RUNNER_TEMP/assistant.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/assistant.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/assistant.patch"
          git apply --index --exclude=.github/workflows/ci.yml --whitespace=nowarn --ignore-space-change --ignore-whitespace "$RUNNER_TEMP/assistant.patch"
          cargo fmt --all
          cargo fmt --manifest-path fullos/src-tauri/Cargo.toml --all
          git add -- ':(glob)**/*.rs'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format architecture boundary refactor"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
