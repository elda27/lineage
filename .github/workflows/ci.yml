name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply queued source patch
        if: ${{ hashFiles('.github/assistant.patch.gz.b64') != '' }}
        shell: bash
        run: |
          base64 -d .github/assistant.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/assistant.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/assistant.patch"
          git rm .github/assistant.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: move use cases pages and UI primitives to explicit layers"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          include-hidden-files: true
          path: |
            .
            !.git/**
            !target/**
            !fullos/node_modules/**
            !fullos/dist/**
            !fullos/src-tauri/target/**

      - name: Reject obsolete architecture-layer references
        shell: bash
        run: |
          if git grep -n -E 'lineage_core::app|@core/app' -- '*.rs' '*.ts' '*.tsx'; then
            echo "obsolete application-layer references remain" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets

      - name: FullOS Tauri tests
        run: cargo test --manifest-path fullos/src-tauri/Cargo.toml --all-targets

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fullos/pnpm-lock.yaml

      - name: Install FullOS dependencies
        run: pnpm --dir fullos install --frozen-lockfile

      - name: FullOS typecheck and build
        run: pnpm --dir fullos build
