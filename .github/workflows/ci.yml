name: Refresh FullOS Tauri lockfile

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refresh-tauri-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Refresh and commit Cargo.lock
        shell: bash
        run: |
          cargo metadata --manifest-path fullos/src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/fullos-tauri-metadata.json"
          git add fullos/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "FullOS Tauri Cargo.lock was already current" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(fullos): update Tauri lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
