name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check architecture boundaries
        run: python scripts/check_architecture_boundaries.py

      - name: Rust workspace formatting
        run: cargo fmt --all --check

      - name: FullOS Tauri formatting
        run: cargo fmt --manifest-path fullos/src-tauri/Cargo.toml --all --check

      - name: Rust workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Build FullOS bundled executables
        run: cargo build --release -p minos -p agentos --locked

      - name: FullOS Tauri tests
        run: cargo test --manifest-path fullos/src-tauri/Cargo.toml --all-targets --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fullos/pnpm-lock.yaml

      - name: Install FullOS dependencies
        run: pnpm --dir fullos install --frozen-lockfile

      - name: FullOS typecheck and build
        run: pnpm --dir fullos build
