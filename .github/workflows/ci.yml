name: Prepare formatted patch

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: prepare-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare formatted Rust patch
        shell: bash
        run: |
          cat .github/assistant.patch.gz.b64.part-* | tr -d '\r\n' > "$RUNNER_TEMP/assistant.patch.gz.b64"
          base64 -d "$RUNNER_TEMP/assistant.patch.gz.b64" | gzip -d > "$RUNNER_TEMP/assistant.patch"
          git apply --index --exclude=.github/workflows/ci.yml --whitespace=nowarn --ignore-space-change --ignore-whitespace "$RUNNER_TEMP/assistant.patch"
          cargo fmt --all
          cargo fmt --manifest-path fullos/src-tauri/Cargo.toml --all
          git add -A
          git diff --cached --binary -- ':(glob)**/*.rs' > "$RUNNER_TEMP/pr43-formatted-rust.patch"
          test -s "$RUNNER_TEMP/pr43-formatted-rust.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: pr43-formatted-rust-patch
          path: ${{ runner.temp }}/pr43-formatted-rust.patch
          if-no-files-found: error
          retention-days: 1
