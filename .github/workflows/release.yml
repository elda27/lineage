# Publish a GitHub Release -> build the Windows installer and attach it to it.
#
# fullos と minos は 1 つの MSI にまとまっている。`tauri build --bundles msi` が
# WiX 経由で MSI を作り、minos.exe は tauri.conf.json の beforeBuildCommand で
# ビルドされて bundle.resources 経由で同じ MSI に入る。updater 用の成果物
# (.msi.sig + latest.json) も同じステップで作られ、fullos のアプリ内 updater が
# このリリースから取得する。
#
# ジョブはトリガーになったリリースへアップロードするので、手作業はリリースの
# publish だけ。
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload to, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      release_id: ${{ steps.resolve.outputs.release_id }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::tag '$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi
          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"

  installer:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: fullos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fullos/src-tauri
            minos

      - name: Set version from tag
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          if ($expected -ne '${{ needs.prepare.outputs.version }}') {
            throw "release tag version '${{ needs.prepare.outputs.version }}' does not match VERSION '$expected'"
          }
          node .github/scripts/set-version.mjs --check

      - name: Install dependencies
        working-directory: fullos
        run: pnpm install --no-frozen-lockfile

      # minos は tauri の beforeBuildCommand でも自動ビルドされるが、キャッシュが
      # 効いていないときに時間のかかる工程なのでログ上分けておく（2 回目は no-op）。
      - name: Build minos
        working-directory: minos
        run: cargo build --release

      # Builds the MSI (fullos + minos), signs it with the updater key and
      # uploads the bundle, its .sig and latest.json to the release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: fullos
          tauriScript: pnpm tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json must point at the WiX MSI, not the NSIS setup.exe.
          updaterJsonPreferNsis: false
          args: --bundles msi
