# main が動くたびに開発版インストーラを作り、`nightly` プレリリースを載せ替える。
#
# 正式リリース（release.yml）との違いは 3 つだけ。
#
#   - タグは `vX.Y.Z` ではなく固定の `nightly`。毎回 main の先頭へ付け替えるので
#     ダウンロード URL は https://github.com/elda27/lineage/releases/tag/nightly で固定される。
#   - バージョンは VERSION のパッチを 1 つ上げて実行番号を prerelease に付けた
#     `X.Y.(Z+1)-<run_number>`。VERSION 自体はコミットしない（ビルド時にだけ書き換える）。
#   - リリースは必ず prerelease。GitHub の `releases/latest` は prerelease を返さないので、
#     fullos のアプリ内 updater は `releases/download/nightly/latest.json` を直接見る。
#
# 成果物は release.yml と同じ MSI + .msi.sig + latest.json。
name: nightly

on:
  push:
    branches: [main]
    # ドキュメントだけの更新で MSI を作り直しても中身は変わらない。
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

# nightly は「main の最新」だけあればよいので、走行中に次の push が来たら古い方は捨てる。
concurrency:
  group: nightly
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      # 例: VERSION が 0.0.6 で 42 回目の実行なら 0.0.7-42。
      #
      # prerelease を数字だけにするのは MSI のため。tauri のバンドラは semver を
      # WiX の ProductVersion（X.Y.Z.W）へ変換するとき prerelease を 4 つ目の桁に使うので、
      # `-nightly` のような文字列を入れるとビルドが落ちる。
      #
      # パッチを 1 つ上げるのは、semver で `0.0.6-42 < 0.0.6`（prerelease は正式版より古い）
      # となり、直前のリリースより新しいはずの nightly が古く見えてしまうため。
      - id: version
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          base="${base%%-*}"
          base="${base%%+*}"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::VERSION '$base' is not X.Y.Z"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] + 1 ))-${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nightly version: $version"

      # リリースはタグ名で成果物を持つので、タグ自体を今回のコミットへ付け替える。
      # GITHUB_TOKEN による push は workflow を起動しないため、release.yml は反応しない。
      - name: Move the nightly tag to this commit
        run: |
          set -euo pipefail
          git tag -f "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$NIGHTLY_TAG"

      # リリースは消さずに使い回す。ここで作り直すと、ビルドが落ちたときに
      # 前回の nightly まで消えてダウンロードできる物が無くなる。
      # 古い成果物の削除は、新しい成果物を上げ終えた cleanup で行う。
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf 'main の最新コミットから自動で作られる開発版ビルドです。動作確認はしていません。\n\n'
            printf -- '- version: `%s`\n' "$VERSION"
            printf -- '- commit: %s/commit/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- built: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '\n正式版は https://github.com/%s/releases/latest から取得してください。\n' "$GITHUB_REPOSITORY"
          } > nightly-notes.md
          if gh release view "$NIGHTLY_TAG" > /dev/null 2>&1; then
            gh release edit "$NIGHTLY_TAG" --prerelease --latest=false \
              --title "nightly" --notes-file nightly-notes.md
          else
            gh release create "$NIGHTLY_TAG" --prerelease --latest=false \
              --title "nightly" --notes-file nightly-notes.md
          fi
          release_id="$(gh release view "$NIGHTLY_TAG" --json databaseId --jq .databaseId)"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # 中身は release.yml の installer と同じ。違いはタグ検査の代わりに
  # nightly バージョンを書き込むところだけ。
  installer:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: fullos/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # minos / agentos / lineage-core はルートのワークスペース（= ./target）に入る。
          workspaces: |
            .
            fullos/src-tauri

      # VERSION と各マニフェストを nightly のバージョンに揃え、
      # updater は固定の nightly prerelease を参照させる。コミットはしない。
      - name: Set nightly version and updater channel
        run: |
          node .github/scripts/set-version.mjs --set ${{ needs.prepare.outputs.version }}
          node .github/scripts/set-updater-channel.mjs nightly

      - name: Install dependencies
        working-directory: fullos
        run: pnpm install --no-frozen-lockfile

      - name: Build minos
        working-directory: minos
        run: cargo build --release

      # MSI（fullos + minos）を作って署名し、bundle と .sig と latest.json を
      # nightly リリースへ上げる。同名の成果物は差し替えられる。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: fullos
          tauriScript: pnpm tauri
          tagName: ${{ env.NIGHTLY_TAG }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          updaterJsonPreferNsis: false
          args: --bundles msi

  cleanup:
    needs: [prepare, installer]
    runs-on: ubuntu-latest
    steps:
      # MSI のファイル名にはバージョンが入るので、上書きされず前回分が残る。
      # 併せて prerelease であることを確認し直す（ここが外れると
      # `releases/latest` が nightly を返し、正式版の updater が開発版を配ってしまう）。
      - name: Drop assets from older nightly builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$NIGHTLY_TAG" --prerelease --latest=false
          gh release view "$NIGHTLY_TAG" --json assets --jq '.assets[].name' |
            while read -r name; do
              case "$name" in
                *"$VERSION"* | latest.json) ;;
                *)
                  echo "removing stale asset: $name"
                  gh release delete-asset "$NIGHTLY_TAG" "$name" --yes
                  ;;
              esac
            done
