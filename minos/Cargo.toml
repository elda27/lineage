[package]
name = "minos"
version = "0.0.5"
edition = "2024"

[dependencies]
# ドメイン・ユースケース・永続化は共有クレートに置いてある。
# minos に残るのは gpui の画面と OS 常駐まわりだけ。
lineage-core = { path = "../lineage-core" }

# gpui = "0.2.2"
# gpui-component = "0.5.1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

anyhow = { workspace = true }
async-channel = "2"
env_logger = "0.11"
log = "0.4"
# gpui-component の入力補完 API が使う型。バージョンを合わせる必要がある。
lsp-types = { version = "0.97", features = ["proposed"] }
tray-icon = "0.24"

[dev-dependencies]
# テスト用の差し替え実装（FixedClock など）を使えるようにする。
lineage-core = { path = "../lineage-core", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
