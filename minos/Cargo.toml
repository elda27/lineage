[package]
name = "minos"
version = "0.0.8"
edition = "2024"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:async-channel", "dep:env_logger", "dep:log", "dep:lsp-types", "dep:tray-icon", "dep:windows"]

[[bin]]
name = "minos"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
# 共有記録の保存境界。入力・設定の解釈は Minos が所有する。
lineage-core = { path = "../lineage-core" }

# gpui = "0.2.2"
# gpui-component = "0.5.1"
gpui = { optional = true, git = "https://github.com/zed-industries/zed" }
gpui_platform = { optional = true, git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
] }
gpui-component = { optional = true, git = "https://github.com/longbridge/gpui-component" }

anyhow = { workspace = true }
dirs = { workspace = true }
async-channel = { version = "2", optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }
# gpui-component の入力補完 API が使う型。バージョンを合わせる必要がある。
lsp-types = { optional = true, version = "0.97", features = ["proposed"] }
tray-icon = { version = "0.24", optional = true }
uuid = { workspace = true }

[dev-dependencies]
# テスト用の差し替え実装（FixedClock など）を使えるようにする。
lineage-core = { path = "../lineage-core", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows = { optional = true, version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
