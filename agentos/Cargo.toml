[package]
name = "agentos"
version = "0.0.8"
edition = "2024"
description = "Lineage の自動化を実行する CUI。常駐せず、状態も持たない。"

[dependencies]
lineage-core = { path = "../lineage-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }

# 自動化バックエンド（生成AIの HTTP 呼び出し）。Rust に公式 SDK は無いので
# Messages API を直接叩く。rustls を使い、OS ごとの OpenSSL 依存を避ける。
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
# API キーは OS の資格情報ストアに置く（SQLite には参照キーすら書かない）。
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
# スケジュール実行の cron 式。
cron = "0.15"

chrono = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
lineage-core = { path = "../lineage-core", features = ["testing"] }
