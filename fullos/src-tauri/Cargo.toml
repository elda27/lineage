[package]
name = "fullos"
version = "0.0.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fullos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# minos が書いたローカル SQLite を webview 側（plugin-sql）から読むため。
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ブラウザ方式で回収した応答をウィンドウタイトル経由で運ぶときの符号化（src/browser.rs）。
base64 = "0.22"

# 自動化の実行は同梱の agentos.exe に任せる（src/automation.rs）。
# lineage-core を直接リンクしないのは、rusqlite と tauri-plugin-sql(sqlx) が
# どちらも native の sqlite3 をリンクしていて衝突するため。1プロセスに sqlite の
# スタックを2つ抱えるのも避けたいので、実行エンジンは別プロセスに分けている。

# 自動更新はデスクトップのみ。updater が再起動に process プラグインを使う。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

