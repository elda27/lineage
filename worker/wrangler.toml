name = "lineage-api"
main = "index.ts"
compatibility_date = "2026-06-01"

# D1 (SQLite 互換)。スキーマは db/schema.sql と同一内容を worker/migrations に置く。
#   wrangler d1 migrations apply lineage
[[d1_databases]]
binding = "DB"
database_name = "lineage"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# 認証(スタブ配線): 下記を設定すると Worker の JWT 検証が有効化される。
# 未設定なら認証なしで動作し actor="anonymous" になる。
[vars]
# SUPABASE_JWKS_URL = "https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json"
# SUPABASE_JWT_ISSUER = "https://<project-ref>.supabase.co/auth/v1"

# R2 添付ストレージは今回スコープ外（後続）。
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "lineage-files"
